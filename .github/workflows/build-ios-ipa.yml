name: Build unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify server and web code
        run: |
          node --check server/server.js
          node --check server/db.js
          node --check server/public/widget.js
          node --check admin/app.js
          cd server
          npm audit --omit=dev

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project ios/ServiceDesk.xcodeproj \
            -scheme ServiceDesk \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/ServiceDesk.app build/Payload/
          cd build
          zip -qry ServiceDesk-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ServiceDesk-1.3.0-unsigned-ipa
          path: build/ServiceDesk-unsigned.ipa
          if-no-files-found: error
